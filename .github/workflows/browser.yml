name: browser

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  browser:
    # Every OS publishes the browser client: the shader translation loads a native library per OS and the publish
    # tools are scripts, so each must be shown to work. The game itself is then run on macOS only: like the desktop
    # smoke run, that exercises the full material shaders through Metal.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The publisher installs the workload itself rather than this file naming one: the hosted images can default
      # to a newer SDK than the project targets, which then needs wasm-tools-net10 rather than wasm-tools. A plain
      # 'dotnet workload restore' finds nothing to install, because it reads the project as a Debug build and only
      # the Release build compiles ahead of time.
      - name: Publish the installable game
        run: python tools/browser/publish.py --restore-workloads
      - name: Publish it with the threaded runtime as well
        run: python tools/browser/publish.py --threads --restore-workloads --output artifacts/browser-threads
      - name: Check browser host formatting
        if: runner.os == 'macOS'
        run: dotnet format src/Tunnerer.Browser/Tunnerer.Browser.csproj --verify-no-changes --no-restore
      - name: Script tests
        run: node --test tools/browser/pace.test.mjs
      - name: Browser smoke tests
        if: runner.os == 'macOS'
        # Hosted macOS GPUs can be unavailable; keep build/format blocking and retain diagnostics.
        # This follows the desktop graphics smoke run in dotnet-tests.yml.
        continue-on-error: true
        run: |
          npm install --prefix artifacts/browser-tests playwright@1.65.1
          artifacts/browser-tests/node_modules/.bin/playwright install --with-deps chromium
          python tools/browser/serve.py > artifacts/browser-server.log 2>&1 &
          export PLAYWRIGHT_MODULE="$PWD/artifacts/browser-tests/node_modules/playwright/index.mjs"
          node tools/browser/smoke.mjs
          # The same again in the threaded runtime, which needs the isolation headers.
          python tools/browser/serve.py artifacts/browser-threads/wwwroot --port 8704 --isolate > artifacts/browser-threads-server.log 2>&1 &
          SMOKE_THREADS=1 BROWSER_URL=http://localhost:8704 node tools/browser/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && always()
        with:
          name: tunnerer-browser
          path: |
            artifacts/browser/tunnerer-browser.zip
            artifacts/browser-threads/tunnerer-browser.zip
            artifacts/browser-tests/*.png
            artifacts/browser-server.log
            artifacts/browser-threads-server.log
