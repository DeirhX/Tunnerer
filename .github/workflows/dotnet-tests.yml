name: dotnet-tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # macOS builds the whole solution, Desktop included, so changes that break the Mac build fail CI. The DX11
    # shaders are compiled on Windows only (see CompileDx11Shaders in Tunnerer.Desktop.csproj).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore "Tunnerer.slnx"
      - name: Build
        run: dotnet build "Tunnerer.slnx" -c Release --no-restore
      - name: Test
        run: dotnet test "Tunnerer.slnx" -c Release --no-build
