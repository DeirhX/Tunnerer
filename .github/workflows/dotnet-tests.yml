name: dotnet-tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore "Tunnerer.slnx"
      - name: Build
        run: dotnet build "Tunnerer.slnx" -c Release --no-restore
      - name: Test
        run: dotnet test "Tunnerer.slnx" -c Release --no-build
